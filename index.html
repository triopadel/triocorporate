<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Live scores, groups and playoff brackets for the Trio Corporate Tournament at Trio Padel Arena, Dummar Project, Damascus. 8 to 10 October 2026.">
<meta name="theme-color" content="#0A1226">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trio Padel">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="format-detection" content="telephone=no">
<title>Trio Corporate Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@700&display=swap">
<style>html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0;font-size:15px;overflow-x:hidden}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: dark navy-and-gold band on top (day strip), sticky bar with view + category tabs,
   then match cards / group tables / playoff bracket / event info. Scorekeeper bottom sheet. */
:root{
  --bg:#F2F0EA; --surface:#FFFFFF; --ink:#0E1526; --muted:#5E6577; --line:#DDD8CC;
  --navy:#0A1226; --navy-2:#16244A; --on-navy:#FFFFFF; --on-navy-dim:rgba(255,255,255,.7);
  --gold:#E3B341; --on-gold:#1A1405; --gold-ink:#8A6512; --live:#D93A27; --win:#1C8549; --soft:#EAE6DB;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ar:"Noto Kufi Arabic","Geeza Pro","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#070C18; --surface:#0F1830; --ink:#E9ECF3; --muted:#8E97AB; --line:#222E4A;
  --navy:#060B18; --navy-2:#16244A; --gold:#E3B341; --on-gold:#1A1405; --gold-ink:#E9C25E;
  --live:#FF5C49; --win:#3CC779; --soft:#162140; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#070C18; --surface:#0F1830; --ink:#E9ECF3; --muted:#8E97AB; --line:#222E4A;
  --navy:#060B18; --navy-2:#16244A; --gold:#E3B341; --on-gold:#1A1405; --gold-ink:#E9C25E;
  --live:#FF5C49; --win:#3CC779; --soft:#162140; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.band{background:linear-gradient(135deg,#0A1226 0%,#13214A 52%,#0A1226 100%);color:var(--on-navy);position:relative;overflow:hidden}
.band::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(115deg,transparent 0 90px,rgba(227,179,65,.13) 90px 96px,transparent 96px 210px)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.top{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:22px 14px}
.wordmark{display:inline-flex;align-items:baseline;gap:8px;margin-bottom:10px;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.14em;color:var(--gold);line-height:1}
.wordmark small{font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--on-navy-dim)}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,48px);line-height:.95;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.brand h1 span{color:var(--gold)}
.brand .sub{margin-top:6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-navy-dim)}
.ar{font-family:var(--ar);font-size:19px;line-height:1.3;direction:rtl;text-align:left;margin-bottom:2px}
.livecount{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(227,179,65,.35);border-radius:999px;padding:6px 12px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}
.dot.on{background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
@media (prefers-reduced-motion:reduce){.dot.on{animation:none}}

.days{position:relative;display:flex;gap:6px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;min-width:96px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.06);color:var(--on-navy);padding:7px 11px 6px;text-align:left}
.day b{display:block;font-family:var(--display);font-size:20px;line-height:1;font-weight:700}
.day small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--on-navy-dim)}
.day[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.day[aria-pressed="true"] small{color:var(--on-gold)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:10px}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.keeper-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:600;font-size:14px}
.keeper-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main.wrap{padding-block:18px 28px;display:grid;gap:26px}
.sec h2{margin:0 0 10px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec h2 .n{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;text-transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}

.m{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.m.live{border-color:var(--live);box-shadow:inset 3px 0 0 var(--live)}
.keep{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.keep:hover{border-color:var(--muted)}
.mh{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.cat{font-family:var(--display);font-weight:800;font-size:14px;width:24px;height:22px;display:grid;place-items:center;border-radius:6px;background:var(--navy-2);color:var(--gold);flex:none}
.pill{margin-left:auto;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill.live{background:color-mix(in srgb,var(--live) 14%,transparent);color:var(--live)}
.pill.final{background:var(--ink);color:var(--bg)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px}
.team{min-width:0;font-weight:500;line-height:1.25}
.team .p{display:block;overflow-wrap:anywhere}
.co{display:block;font-size:12px;font-weight:500;color:var(--gold-ink);letter-spacing:.02em}
.tbd{color:var(--muted);font-style:italic;font-weight:500}
.row.w .team{font-weight:700}
.row.l .team{color:var(--muted)}
.sets{display:flex;gap:4px}
.sets span{width:26px;text-align:center;font-family:var(--display);font-weight:700;font-size:22px;line-height:1}
.sets span.stb{font-size:16px;color:var(--muted)}
.row.l .sets span{color:var(--muted)}
.sets span.won{color:var(--ink)}
.pt{min-width:38px;text-align:center;font-family:var(--display);font-weight:800;font-size:20px;line-height:1;padding:5px 6px;border-radius:7px;background:var(--gold);color:var(--on-gold)}
.pt.empty{display:none}
.wmark{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--win);margin-left:6px;vertical-align:middle}
.mf{font-size:12px;color:var(--muted)}
.stg{color:var(--gold-ink);font-weight:700}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px;color:var(--muted);max-width:640px}
.empty b{color:var(--ink)}

.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{padding:9px 10px;text-align:right;white-space:nowrap}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal}
td:first-child{font-family:var(--display);font-weight:700;font-size:17px;color:var(--muted);width:32px}
tr.q td:first-child{color:var(--gold-ink);box-shadow:inset 3px 0 0 var(--gold)}
td.wins{font-family:var(--display);font-weight:800;font-size:18px}
.pos{color:var(--win)} .neg{color:var(--live)}
.note{font-size:13px;color:var(--muted);margin:8px 2px 0;max-width:70ch}
.subh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.mini{font-family:var(--body);letter-spacing:0;text-transform:none;padding:3px 10px;font-size:13px}

/* bracket */
.br{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.col{display:flex;flex-direction:column;min-width:0;scroll-snap-align:start}
.colh{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.colb{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.bm{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
.bm.live{border-color:var(--live);box-shadow:inset 3px 0 0 var(--live)}
.bm .ln{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line)}
.bm .seed{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.04em;background:var(--soft);color:var(--muted);border-radius:5px;padding:1px 5px;min-width:26px;text-align:center}
.bm .seed.g{background:var(--gold);color:var(--on-gold)}
.bm .nm{min-width:0;overflow-wrap:anywhere;line-height:1.25}
.bm .nm.w{font-weight:700}
.bm .nm.l{color:var(--muted)}
.bm .sc{font-family:var(--display);font-weight:700;font-size:17px;white-space:nowrap}
.bm .meta{padding:5px 10px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--soft) 55%,transparent)}
.champ{margin-top:12px;display:inline-flex;align-items:center;gap:10px;background:var(--navy-2);color:#fff;border-radius:12px;padding:10px 14px;font-weight:600}
.champ b{font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}

/* info */
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.box h3{margin:0 0 8px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.box h3 .cat{display:inline-grid;margin-right:6px;vertical-align:2px}
.box ul{margin:0;padding-left:18px}
.box li{margin:3px 0}
.box p{margin:0 0 6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.tbc{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink);border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);border-radius:999px;padding:0 7px;margin-left:4px;vertical-align:1px}
.prize td:first-child{font-family:var(--body);font-weight:600;font-size:14px;color:var(--ink);width:auto;text-align:left}
.prize td:nth-child(2){text-align:right}
.prize table{min-width:0}
.money{font-family:var(--display);font-weight:700;font-size:18px}

/* scorekeeper sheet */
.scrim{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:580px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.sheet h3{margin:0;font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:10px}
.sheet h3 .x{margin-left:auto;border:0;background:var(--soft);border-radius:8px;padding:4px 10px;font-size:14px}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.padbtn{border:0;border-radius:12px;background:var(--navy-2);color:#fff;padding:14px 10px;display:grid;gap:6px;justify-items:center;text-align:center;min-height:120px}
.padbtn .nm{font-size:13.5px;line-height:1.25;color:rgba(255,255,255,.75);overflow-wrap:anywhere}
.padbtn .big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;color:var(--gold)}
.padbtn .gs{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em}
.padbtn:active{transform:scale(.98)}
.padbtn:disabled{opacity:.45;cursor:default}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn.warn{color:var(--live);border-color:color-mix(in srgb,var(--live) 50%,var(--line))}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:grid;gap:4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;min-width:0}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
details.more summary{cursor:pointer;font-weight:600;font-size:14px}
details.more[open] summary{margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:420px){ .form{grid-template-columns:1fr} .sets span{width:22px;font-size:20px} }
@media (max-width:600px){
  .top{padding-block:16px 12px}
  .wordmark{font-size:24px;margin-bottom:8px}
  .brand .sub{font-size:11.5px;letter-spacing:.06em}
  .ar{font-size:16px}
  .livecount{font-size:14px;padding:5px 10px}
  .bar .wrap{display:grid;grid-template-columns:1fr auto;gap:8px;padding-block:8px}
  #views{grid-column:1/-1;order:-1}
  #views button,#cats button{flex:1}
  .seg button{padding:8px 8px}
  .keeper-btn{padding:8px 10px;font-size:13.5px;white-space:nowrap}
  main.wrap{padding-block:14px 24px;gap:22px}
  .sec h2{font-size:20px;row-gap:2px}
  .m{padding:12px}
  table{min-width:0;font-size:13.5px}
  th,td{padding:8px 5px}
  th{font-size:10.5px;letter-spacing:.05em}
  .grp th:nth-child(6),.grp td:nth-child(6){display:none}
  td:nth-child(2){white-space:normal;overflow-wrap:anywhere;line-height:1.3}
  td:first-child{width:22px;font-size:15px}
  .br{grid-auto-columns:minmax(78%,1fr)}
  .padbtn{min-height:130px}
  .padbtn .big{font-size:48px}
  .sheet{padding-inline:14px}
}
@media (max-width:360px){ #keeper{font-size:12.5px} .day{min-width:88px} }
</style>
</head>
<body>

<div class="band">
  <div class="wrap top">
    <div class="brand">
      <div class="wordmark">TRIO <small>PADEL ARENA</small></div>
      <div class="ar" lang="ar">بطولة الشركات للبادل</div>
      <h1>Corporate <span>Tournament</span></h1>
      <div class="sub">Dummar Project · Damascus · 8–10 Oct 2026</div>
    </div>
    <div class="livecount" id="livecount"><span class="dot"></span><span>Connecting</span></div>
  </div>
  <div class="wrap days" id="days" role="group" aria-label="Tournament day"></div>
</div>

<div class="bar">
  <div class="wrap">
    <div class="seg" id="views" role="group" aria-label="View">
      <button data-view="matches" aria-pressed="true">Matches</button>
      <button data-view="groups" aria-pressed="false">Groups</button>
      <button data-view="bracket" aria-pressed="false">Playoffs</button>
      <button data-view="info" aria-pressed="false">Info</button>
    </div>
    <div class="seg" id="cats" role="group" aria-label="Category">
      <button data-cat="All" aria-pressed="true">All</button>
      <button data-cat="A" aria-pressed="false">Cat A</button>
      <button data-cat="B" aria-pressed="false">Cat B</button>
    </div>
    <div style="display:flex;gap:6px"><button class="keeper-btn" id="keeper" aria-pressed="false" hidden>Scorekeeper</button><button class="keeper-btn" id="signout" hidden>Sign out</button></div>
  </div>
</div>

<main class="wrap" id="main">
  <div class="empty"><b>Loading matches…</b><br>Scores update live as the scorekeepers enter each point.</div>
</main>

<div class="wrap" id="addRoot" style="padding-bottom:48px"></div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(() => {
  // ---------- tournament setup ----------
  // Same Firebase project and scorekeeper logins as Kinza; this tournament's data lives under tournaments/<slug>/.
  const SLUG = 'triocorporate';
  const COL = {m: `tournaments/${SLUG}/matches`, g: `tournaments/${SLUG}/groups`, c: `tournaments/${SLUG}/config`};
  const CATS = ['A', 'B'];
  const DAY0 = new Date(2026, 9, 8); // Day 1 = Thu 8 Oct 2026
  const DAY_SUB = ['Group stage', 'R16 · Quarters', 'Semis · Final'];
  const dayInfo = i => { const d = new Date(DAY0); d.setDate(d.getDate() + i); return {n: i + 1, date: d.toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short'}), sub: DAY_SUB[i] || ''}; };
  const DAYS = Array.from({length: 3}, (_, i) => dayInfo(i));
  const growDays = () => { const max = Math.max(0, ...Object.values(M).map(m => +m.day || 0)); while (DAYS.length < max) DAYS.push(dayInfo(DAYS.length)); };

  const STAGES = [['R16', 'Round of 16'], ['QF', 'Quarter-final'], ['SF', 'Semi-final'], ['3P', 'Third place'], ['F', 'Final']];
  const stageName = k => (STAGES.find(x => x[0] === k) || [])[1] || '';
  const STAGE_SHORT = {R16: 'R16', QF: 'QF', SF: 'SF', '3P': '3rd place', F: 'Final'};
  const STAGE_DAY = {R16: 2, QF: 2, SF: 3, '3P': 3, F: 3};
  // Playoff draw from the official brackets. "1A" = 1st in Group A of that category.
  const BRACKET = {
    A: {rounds: ['QF', 'SF', 'F'], seeds: [['1A', '4B'], ['2B', '3A'], ['2A', '3B'], ['1B', '4A']]},
    B: {rounds: ['R16', 'QF', 'SF', 'F'], seeds: [['1A', '4D'], ['2B', '3C'], ['4B', '1C'], ['2D', '3A'], ['1B', '4C'], ['2A', '3D'], ['1D', '4A'], ['2C', '3B']]}
  };
  const roundSize = (cat, st) => { const B = BRACKET[cat]; if (st === '3P') return 1; const i = B.rounds.indexOf(st); return i < 0 ? 0 : B.seeds.length / 2 ** i; };
  // Formats from the official rules. 'stb' = third set replaced by a tie-break to 10.
  // 'cfg' = not announced yet; follows the tournament rules setting (Info tab).
  const FMT = {
    A: {G: {bo: 1, games: 6}, QF: {bo: 3, games: 6, dec: 'stb'}, SF: {bo: 3, games: 6, dec: 'cfg'}, '3P': {bo: 3, games: 6, dec: 'cfg'}, F: {bo: 3, games: 6, dec: 'cfg'}},
    B: {G: {bo: 1, games: 6}, R16: {bo: 1, games: 9}, QF: {bo: 1, games: 9}, SF: {bo: 3, games: 6, dec: 'cfg'}, '3P': {bo: 3, games: 6, dec: 'cfg'}, F: {bo: 3, games: 6, dec: 'cfg'}}
  };
  const PRIZES = {
    A: [['1st place', '15,000,000', '2,000,000'], ['2nd place', '7,000,000', '2,000,000'], ['3rd place', '', '1,000,000'], ['4th place', '', '1,000,000'], ['Best player', '', '1,000,000']],
    B: [['1st place', '10,000,000', '1,500,000'], ['2nd place', '5,000,000', '1,500,000'], ['3rd place', '', '1,000,000'], ['4th place', '', '1,000,000'], ['Best player', '', '1,000,000']]
  };

  const todayDay = () => {
    const n = new Date(); const t = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    let d = Math.round((t - DAY0) / 864e5) + 1;
    if (n.getHours() < 6) d--; // after midnight still belongs to the previous evening's session
    return Math.min(DAYS.length, Math.max(1, d));
  };

  const S = {view: 'matches', day: todayDay(), cat: 'All', keeper: false, open: null};
  let M = {}, G = {}, CFG = {}, TABS = {};
  let db = null, auth = null, user = null, loaded = false;
  const chains = {};

  const $ = s => document.querySelector(s);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const toast = msg => { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3000); };

  // ---------- scoring ----------
  const fmtOf = m => {
    const base = ((FMT[m.cat] || FMT.B)[m.stage || 'G']) || {bo: 1, games: 6};
    const d = {bo: base.bo, games: base.games, tbAt: base.games === 9 ? 8 : base.games, deuce: CFG.deuce || 'adv1',
      dec: base.dec === 'cfg' ? (CFG.decider || 'set') : (base.dec || 'set')};
    if (!m.custom) return d;
    return {bo: m.bo || d.bo, games: m.games || d.games, tbAt: m.tbAt || d.tbAt, deuce: m.deuce || d.deuce, dec: m.dec || d.dec};
  };
  const setsArr = m => (m.s || []).map(x => [x.a | 0, x.b | 0]);
  const setsWon = s => s.reduce((w, x) => (x[0] > x[1] ? w[0]++ : x[1] > x[0] ? w[1]++ : 0, w), [0, 0]);
  const deriveWinner = s => {
    const w = setsWon(s); if (w[0] !== w[1]) return w[0] > w[1] ? 0 : 1;
    const g = s.reduce((a, x) => [a[0] + x[0], a[1] + x[1]], [0, 0]);
    return g[0] === g[1] ? null : (g[0] > g[1] ? 0 : 1);
  };
  const isTB = (m, cur) => { const f = fmtOf(m); return cur && cur[0] === f.tbAt && cur[1] === f.tbAt; };
  // The deciding set is a match tie-break to 10 (only once sets are level).
  const isSTB = (m, s) => { const f = fmtOf(m); if (f.dec !== 'stb' || f.bo < 3 || s.length !== f.bo) return false;
    const w = setsWon(s.slice(0, -1)); return w[0] === w[1]; };

  function applyPoint(m, side) {
    if (m.status === 'final') return null;
    const f = fmtOf(m), o = 1 - side;
    const s = setsArr(m); let g = m.g ? [m.g.a | 0, m.g.b | 0] : [0, 0];
    if (!s.length) s.push([0, 0]);
    const flags = s.map((_, i) => !!((m.s || [])[i] || {}).tb);
    const cur = s[s.length - 1];
    let status = 'live', winner = null;
    if (isSTB(m, s)) {
      g[side]++;
      if (g[side] >= 10 && g[side] - g[o] >= 2) { cur[0] = g[0]; cur[1] = g[1]; flags[s.length - 1] = true; g = [0, 0]; status = 'final'; winner = side; }
    } else {
      const tb = isTB(m, cur);
      g[side]++;
      const gameWon = tb ? (g[side] >= 7 && g[side] - g[o] >= 2)
                  : f.deuce === 'golden' ? (g[side] >= 4 && g[side] > g[o])
                  : f.deuce === 'adv1' ? (g[side] >= 4 && (g[side] - g[o] >= 2 || (g[o] >= 4 && g[side] > g[o])))
                  : (g[side] >= 4 && g[side] - g[o] >= 2);
      if (gameWon) {
        cur[side]++; g = [0, 0];
        const setWon = (cur[side] >= f.games && cur[side] - cur[o] >= 2) || (cur[side] === f.tbAt + 1 && cur[o] === f.tbAt);
        if (setWon) {
          if (setsWon(s)[side] > Math.floor(f.bo / 2)) { status = 'final'; winner = side; }
          else { s.push([0, 0]); flags.push(false); }
        }
      }
    }
    return {s: s.map((x, i) => flags[i] ? {a: x[0], b: x[1], tb: true} : {a: x[0], b: x[1]}), g: {a: g[0], b: g[1]}, status, winner};
  }
  function goldenNow(m) { const f = fmtOf(m), g = m.g || {a: 0, b: 0};
    return g.a === g.b && g.a >= 3 && (f.deuce === 'golden' || (f.deuce === 'adv1' && g.a >= 4)); }
  function ptLabels(m) {
    const s = setsArr(m), g = m.g || {a: 0, b: 0}, cur = s[s.length - 1];
    if (isTB(m, cur) || (s.length && isSTB(m, s))) return [String(g.a), String(g.b)];
    const L = ['0', '15', '30', '40'];
    if (g.a >= 3 && g.b >= 3) { if (g.a === g.b) return ['40', '40']; return g.a > g.b ? ['AD', '40'] : ['40', 'AD']; }
    return [L[Math.min(g.a, 3)], L[Math.min(g.b, 3)]];
  }

  // ---------- helpers ----------
  const time12 = t => { if (!t) return ''; let [h, mi] = t.split(':').map(Number); h = h % 24; return `${((h + 11) % 12) + 1}:${String(mi).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
  // Play runs into the night: times from midnight to 5:59 are stored as 24:00–29:59 so they sort after 11 PM.
  const tMin = t => { if (!t) return 9999; let [h, mi] = String(t).split(':').map(Number); if (h < 6) h += 24; return h * 60 + (mi || 0); };
  const toInput = t => { if (!t) return ''; const [h, mi] = String(t).split(':').map(Number); return String(h % 24).padStart(2, '0') + ':' + String(mi || 0).padStart(2, '0'); };
  const fromInput = t => { if (!t) return ''; let [h, mi] = String(t).split(':').map(Number); if (h < 6) h += 24; return String(h).padStart(2, '0') + ':' + String(mi || 0).padStart(2, '0'); };
  const stageOrder = st => st ? 1 + STAGES.findIndex(x => x[0] === st) : 0;
  const sorted = list => list.sort((a, b) => (a.day - b.day) || (tMin(a.time) - tMin(b.time)) || (stageOrder(a.stage) - stageOrder(b.stage)) || ((a.slot || 0) - (b.slot || 0)) || String(a.court).localeCompare(String(b.court)) || String(a.cat).localeCompare(String(b.cat)));
  const inCat = m => S.cat === 'All' || m.cat === S.cat;
  const ago = t => { if (!t) return ''; const s = Math.max(0, Math.round((Date.now() - t) / 1000)); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.floor(s / 60)}m ago` : `${Math.floor(s / 3600)}h ago`; };
  // A team is "Player + Player", optionally followed by the company in brackets: "Ahmad + Rami (Uni Color)".
  const company = t => { const x = /\(([^()]*)\)\s*$/.exec(String(t || '')); return x ? x[1].trim() : ''; };
  const bare = t => String(t || '').replace(/\([^()]*\)\s*$/, '').trim();
  const players = t => bare(t).split('+').map(p => p.trim()).filter(Boolean);
  const teamHTML = (t, opts = {}) => { const ps = players(t), co = company(t);
    return ps.map((p, i) => `<span class="p">${esc(p)}${opts.win && i === ps.length - 1 ? '<i class="wmark" title="Winner"></i>' : ''}</span>`).join('') + (co ? `<span class="co">${esc(co)}</span>` : ''); };
  const teamLine = t => { const co = company(t); return esc(players(t).join(' + ')) + (co ? ` <span class="co" style="display:inline">· ${esc(co)}</span>` : ''); };

  // Names are spelled differently across lists (Kareem/Karim), so each player is reduced to a consonant skeleton.
  const pkey = p => String(p).toLowerCase().replace(/[^a-z ]/g, ' ').split(/\s+/).filter(w => w && w !== 'al' && w !== 'el')
    .map(w => w.replace(/^al(?=.{3})/, '')).join('').replace(/y/g, 'i').replace(/[aeiou]/g, '').replace(/(.)\1+/g, '$1').replace(/h$/, '');
  const xkey = p => String(p).toLowerCase().replace(/[^a-z]/g, '');
  const tkey = t => players(t).map(pkey).sort().join('+');
  const isPlaceholder = t => /^e\s*\d+$/i.test(String(t).trim());
  const phKey = t => 'ph:' + String(t).replace(/\s+/g, '').toUpperCase();
  let resolveCache = {key: null, map: {}};
  function resolveTeam(cat, t) {
    const gkey = JSON.stringify(G);
    if (resolveCache.key !== gkey) resolveCache = {key: gkey, map: {}};
    const ck = cat + '|' + t; if (ck in resolveCache.map) return resolveCache.map[ck];
    const entries = [];
    Object.values(G).filter(g => g.cat === cat).forEach(g => (g.teams || []).forEach(n => { if (!isPlaceholder(n)) entries.push({group: String(g.name), name: n, key: tkey(n), ps: players(n).map(pkey), ex: players(n).map(xkey)}); }));
    const k = tkey(t), ps = players(t).map(pkey), ex = players(t).map(xkey);
    let hit = entries.find(e => e.key === k) || null;
    if (!hit) { const c = entries.filter(e => e.ex.some(p => ex.includes(p))); if (c.length === 1) hit = c[0]; }
    if (!hit) { const c = entries.filter(e => e.ps.some(p => ps.includes(p))); if (c.length === 1) hit = c[0]; }
    return resolveCache.map[ck] = hit;
  }
  function groupOf(m) {
    if (m.stage) return '';
    if (m.group) return String(m.group);
    const a = resolveTeam(m.cat, m.t1), b = resolveTeam(m.cat, m.t2);
    if (a && b && a.group !== b.group) return '';
    return (a || b || {}).group || '';
  }

  // ---------- group tables ----------
  function computeTables() {
    const withGroups = new Set(Object.values(G).map(g => g.cat));
    const T = {};
    const blank = name => ({name, P: 0, W: 0, L: 0, SW: 0, SL: 0, GW: 0, GL: 0, listed: false, ph: false});
    const table = (cat, group) => T[cat + '|' + group] = T[cat + '|' + group] || {cat, group, teams: {}, n: 0, played: 0, pending: 0};
    const teamRow = (X, cat, t) => { const r = isPlaceholder(t) ? null : resolveTeam(cat, t); const k = isPlaceholder(t) ? phKey(t) : r ? tkey(r.name) : tkey(t);
      return X.teams[k] = X.teams[k] || blank(r ? r.name : String(t).trim()); };
    Object.values(G).forEach(g => {
      const X = table(g.cat, String(g.name));
      (g.teams || []).forEach(t => { const k = isPlaceholder(t) ? phKey(t) : tkey(t); X.teams[k] = X.teams[k] || blank(t); X.teams[k].listed = true; X.teams[k].ph = isPlaceholder(t); });
      X.n = (g.teams || []).length;
    });
    Object.values(M).forEach(m => {
      if (m.stage || !m.t1 || !m.t2) return;
      const grp = groupOf(m); if (withGroups.has(m.cat) && !grp) return;
      const X = table(m.cat, grp), a = teamRow(X, m.cat, m.t1), b = teamRow(X, m.cat, m.t2);
      if (m.status !== 'final') { X.pending++; return; }
      const s = setsArr(m), sw = setsWon(s), g = s.reduce((x, y) => [x[0] + y[0], x[1] + y[1]], [0, 0]);
      const w = m.winner ?? deriveWinner(s);
      X.played++; a.P++; b.P++;
      if (w === 0) { a.W++; b.L++; } else if (w === 1) { b.W++; a.L++; }
      a.SW += sw[0]; a.SL += sw[1]; b.SW += sw[1]; b.SL += sw[0];
      a.GW += g[0]; a.GL += g[1]; b.GW += g[1]; b.GL += g[0];
    });
    Object.values(T).forEach(X => {
      let list = Object.values(X.teams);
      if (list.some(r => !r.listed)) list = list.filter(r => !r.ph);
      X.rows = list.sort((x, y) => (y.W - x.W) || ((y.SW - y.SL) - (x.SW - x.SL)) || ((y.GW - y.GL) - (x.GW - x.GL)) || (y.GW - x.GW) || (x.ph - y.ph) || x.name.localeCompare(y.name));
      const n = X.rows.length;
      X.complete = X.pending === 0 && X.played > 0 && X.played >= n * (n - 1) / 2;
    });
    return T;
  }

  // ---------- playoff slots ----------
  const brId = (cat, st, slot) => `${cat}-${st}-${slot}`;
  function refsOf(m) {
    const B = BRACKET[m.cat]; if (!m.stage || !B) return [];
    if (m.stage === '3P') return ['L:SF-1', 'L:SF-2'];
    const i = B.rounds.indexOf(m.stage); if (i < 0) return [];
    if (i === 0) return B.seeds[m.slot - 1] || [];
    const prev = B.rounds[i - 1]; return [`W:${prev}-${2 * m.slot - 1}`, `W:${prev}-${2 * m.slot}`];
  }
  const ORD = ['1st', '2nd', '3rd', '4th', '5th', '6th'];
  function refLabel(ref) {
    let x = /^(\d)([A-Z])$/.exec(ref); if (x) return `${ORD[x[1] - 1]} in Group ${x[2]}`;
    x = /^([WL]):(\w+)-(\d+)$/.exec(ref); if (x) return `${x[1] === 'W' ? 'Winner' : 'Loser'} ${STAGE_SHORT[x[2]] || x[2]} ${x[3]}`;
    return 'To be decided';
  }
  function resolveRef(cat, ref, depth = 0) {
    if (depth > 6) return null;
    let x = /^(\d)([A-Z])$/.exec(ref);
    if (x) { const X = TABS[cat + '|' + x[2]]; const r = X && X.complete && X.rows[x[1] - 1]; return r && !r.ph ? r.name : null; }
    x = /^([WL]):(\w+)-(\d+)$/.exec(ref);
    if (x) { const m = M[brId(cat, x[2], x[3])]; if (!m || m.status !== 'final') return null;
      const w = m.winner ?? deriveWinner(setsArr(m)); if (w == null) return null;
      return teamOf(m, x[1] === 'W' ? w : 1 - w, depth + 1).name || null; }
    return null;
  }
  // The team on one side of a match: typed name first, then the bracket slot once it's decided.
  function teamOf(m, side, depth = 0) {
    const t = side ? m.t2 : m.t1;
    if (t) return {name: t};
    const ref = refsOf(m)[side]; if (!ref) return {name: ''};
    const r = resolveRef(m.cat, ref, depth);
    return r ? {name: r, ref} : {name: '', ref, label: refLabel(ref)};
  }
  const stageLabel = m => m.stage ? stageName(m.stage) + (roundSize(m.cat, m.stage) > 1 ? ' ' + m.slot : '') : '';

  // ---------- render ----------
  function renderDays() {
    growDays();
    $('#days').innerHTML = DAYS.map(d => {
      const n = Object.values(M).filter(m => m.day === d.n && m.status === 'live').length;
      return `<button class="day" data-day="${d.n}" aria-pressed="${S.day === d.n}"><b>Day ${d.n}${n ? ' •' : ''}</b><small>${esc(d.date)}</small><small>${esc(d.sub)}</small></button>`;
    }).join('');
  }
  function renderLiveCount() {
    const n = Object.values(M).filter(m => m.status === 'live').length;
    $('#livecount').innerHTML = !db && loaded ? `<span class="dot"></span><span>Offline</span>`
      : n ? `<span class="dot on"></span><span>${n} live now</span>` : `<span class="dot"></span><span>${loaded ? 'No match live' : 'Connecting'}</span>`;
  }

  function card(m) {
    const s = setsArr(m), live = m.status === 'live', fin = m.status === 'final';
    const pts = live ? ptLabels(m) : null;
    const row = side => {
      const cls = fin && m.winner != null ? (m.winner === side ? 'w' : 'l') : '';
      const tm = teamOf(m, side);
      return `<div class="row ${cls}">
        <div class="team">${tm.name ? teamHTML(tm.name, {win: cls === 'w'}) : `<span class="p tbd">${esc(tm.label || 'To be decided')}</span>`}</div>
        <div class="sets">${s.length ? s.map((x, i) => `<span class="${x[side] > x[1 - side] ? 'won' : ''} ${(m.s[i] || {}).tb ? 'stb' : ''}">${x[side]}</span>`).join('') : '<span>–</span>'}</div>
        <div class="pt ${live ? '' : 'empty'}">${live ? esc(pts[side]) : ''}</div>
      </div>`;
    };
    const pill = live ? `<span class="pill live"><span class="dot on"></span>Live</span>` : fin ? `<span class="pill final">Final</span>` : `<span class="pill">${m.time ? esc(time12(m.time)) : 'Time TBA'}</span>`;
    const grp = groupOf(m);
    const where = [m.stage ? `<b class="stg">${esc(stageLabel(m))}</b>` : grp ? 'Group ' + esc(grp) : '', m.court ? esc(m.court) : '', (live || fin) && m.time ? esc(time12(m.time)) : ''].filter(Boolean).join(' · ');
    return `<article class="m ${live ? 'live' : ''} ${S.keeper ? 'keep' : ''}" data-id="${esc(m.id)}" ${S.keeper ? 'tabindex="0" role="button"' : ''}>
      <div class="mh"><span class="cat">${esc(m.cat)}</span><span>${where || 'Day ' + m.day}</span>${pill}</div>
      ${row(0)}${row(1)}
      ${live && m.t ? `<div class="mf" data-ago="${m.t}">Updated ${ago(m.t)}</div>` : ''}
    </article>`;
  }

  function renderMatches() {
    const all = sorted(Object.values(M));
    const live = all.filter(m => m.status === 'live' && inCat(m));
    const day = all.filter(m => m.day === S.day && inCat(m) && m.status !== 'live');
    let h = '';
    if (live.length) h += `<section class="sec"><h2><span class="dot on"></span>Live now <span class="n">${live.length} match${live.length > 1 ? 'es' : ''}</span></h2><div class="grid">${live.map(card).join('')}</div></section>`;
    const groups = {};
    day.forEach(m => { (groups[m.cat] = groups[m.cat] || []).push(m); });
    const cats = Object.keys(groups).sort();
    if (!cats.length && !live.length) {
      h += `<div class="empty"><b>No matches for Day ${S.day}${S.cat !== 'All' ? ', Category ' + S.cat : ''} yet.</b><br>${S.keeper
        ? (S.day === 1 ? 'Add the groups in the Groups tab, then press “Create matches” for each group.' : 'Set up the playoffs from the Playoffs tab.')
        : 'The schedule appears here as soon as the organizers post it.'}</div>`;
    }
    cats.forEach(c => {
      const ms = groups[c]; const done = ms.filter(m => m.status === 'final').length;
      h += `<section class="sec"><h2>Category ${esc(c)} <span class="n">Day ${S.day} · ${done} of ${ms.length} played</span></h2><div class="grid">${ms.map(card).join('')}</div></section>`;
    });
    return h;
  }

  function renderGroups() {
    const keys = Object.keys(TABS).filter(k => S.cat === 'All' || TABS[k].cat === S.cat).sort((x, y) => x.localeCompare(y, undefined, {numeric: true}));
    let h = '';
    if (!keys.length) h += `<div class="empty"><b>No groups yet.</b><br>${S.keeper ? 'Add each group with its teams below.' : 'Groups appear here once the draw is published.'}</div>`;
    let lastCat = null;
    keys.forEach(k => {
      const X = TABS[k];
      if (X.cat !== lastCat) {
        if (lastCat !== null) h += '</section>';
        const res = Object.values(M).filter(m => m.cat === X.cat && !m.stage && m.status === 'final').length;
        h += `<section class="sec"><h2>Category ${esc(X.cat)} <span class="n">${res} group results · top 4 of each group go through</span></h2>`;
        lastCat = X.cat;
      }
      if (X.group) h += `<div class="subh">Group ${esc(X.group)}${X.complete ? ' <span class="tbc">Complete</span>' : ''}${S.keeper ? ` <button class="btn mini" data-gedit="${esc(X.cat + '|' + X.group)}">Edit group</button> <button class="btn mini" data-rr="${esc(X.cat + '|' + X.group)}">Create matches</button>` : ''}</div>`;
      h += `<div class="tbl"><table class="grp"><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>L</th><th>Sets</th><th>Games</th><th>±</th></tr></thead><tbody>${X.rows.map((r, i) => {
        const d = r.GW - r.GL;
        return `<tr class="${i < 4 && r.P ? 'q' : ''}"><td>${i + 1}</td><td>${players(r.name).map(p => `<span style="display:block">${esc(p)}</span>`).join('') || esc(r.name)}${company(r.name) ? `<span class="co">${esc(company(r.name))}</span>` : ''}${r.ph ? ' <span class="mf">to be confirmed</span>' : ''}</td><td>${r.P}</td><td class="wins">${r.W}</td><td>${r.L}</td><td>${r.SW}–${r.SL}</td><td>${r.GW}–${r.GL}</td><td class="${d > 0 ? 'pos' : d < 0 ? 'neg' : ''}">${d > 0 ? '+' : ''}${d}</td></tr>`;
      }).join('')}</tbody></table></div>`;
    });
    if (lastCat !== null) h += '</section>';
    if (S.keeper) h += `<div class="acts"><button class="btn pri" data-gedit="new">Add a group</button></div>`;
    h += `<p class="note">Ranked by wins, then set difference, then game difference. Only matches marked Final count. Once every match in a group is final, its top 4 move into the playoff bracket automatically.</p>`;
    return h;
  }

  const brMatch = (cat, st, slot) => M[brId(cat, st, slot)] || {id: brId(cat, st, slot), cat, stage: st, slot, day: STAGE_DAY[st], status: 'scheduled', s: [], virtual: true};
  function bm(m) {
    const s = setsArr(m), fin = m.status === 'final', live = m.status === 'live';
    const w = fin ? (m.winner ?? deriveWinner(s)) : null;
    const line = side => {
      const tm = teamOf(m, side), ref = refsOf(m)[side] || '';
      const seed = /^\d[A-Z]$/.test(ref) ? `<span class="seed ${tm.name ? 'g' : ''}">${esc(ref)}</span>` : '<span></span>';
      const cls = w == null ? '' : w === side ? 'w' : 'l';
      const sc = s.map((x, i) => (m.s[i] || {}).tb ? `[${x[side]}]` : x[side]).join(' ');
      return `<div class="ln">${seed}<span class="nm ${cls}">${tm.name ? teamLine(tm.name) : `<span class="tbd">${esc(tm.label || 'To be decided')}</span>`}</span><span class="sc">${sc}</span></div>`;
    };

    const click = S.keeper && !m.virtual;
    return `<div class="bm ${live ? 'live' : ''} ${click ? 'keep' : ''}" ${click ? `data-id="${esc(m.id)}" tabindex="0" role="button"` : ''}>${line(0)}${line(1)}<div class="meta">${roundSize(m.cat, m.stage) > 1 ? esc(STAGE_SHORT[m.stage] + ' ' + m.slot) + ' · ' : ''}${meta}</div></div>`;
  }
  const bracketExists = cat => Object.values(M).some(m => m.cat === cat && m.stage);
  function renderBracket() {
    const cats = CATS.filter(c => S.cat === 'All' || S.cat === c);

    cats.forEach(cat => {
      const B = BRACKET[cat], exists = bracketExists(cat);
      h += `<section class="sec"><h2>Category ${cat} playoffs <span class="n">${B.seeds.length * 2} teams</span></h2>`;
      if (S.keeper && !exists) h += `<div class="acts" style="margin-bottom:12px"><button class="btn gold" data-mkbr="${cat}">Set up these playoff matches</button><span class="hint" style="align-self:center">Creates every playoff match with no time yet. Teams fill in from the group tables.</span></div>`;

        if (tm && tm.name) h += `<div class="champ"><b>Champions</b><span>${teamLine(tm.name)}</span></div>`; }
      h += `</section>`;
    });
    h += `<p class="note">Seeds like “1A” mean 1st place in Group A of that category. Names appear once that group is finished, and winners move forward as each match is marked final.</p>`;
    return h;
  }

  function renderPad() {

    const fin = m.status === 'final', f = fmtOf(m), stb = s.length && isSTB(m, s);
    const btn = side => { const tm = teamOf(m, side);
      return `<button class="padbtn" data-act="pt" data-side="${side}" ${fin ? 'disabled' : ''}>

  }
  const groupId = (cat, name) => Object.keys(G).find(id => G[id].cat === cat && String(G[id].name) === String(name));
  function openGroup(key) {

  function openRules() {

        <div class="acts full"><button class="btn pri" type="submit">Save rules</button></div>
      </form></div></div>`;

  function closeSheet() { keepAwake(false); S.open = null; S.gopen = null; $('#sheetRoot').innerHTML = ''; }

  const failToast = err => toast(err && err.code === 'permission-denied' ? 'This account is not on the scorekeeper list. Ask the organizer to add it.' : 'Could not save that change. Check the connection and try again.');
  // Scorekeepers sign in with a username; Firebase needs an email, so the page adds this tournament's own domain.
  // Each tournament has its own accounts (ahmad@triocorporate.kinzapadel.com). Admins type their full login.
  const KEEPER_DOMAIN = SLUG + '.kinzapadel.com';
  const loginId = u => { u = String(u).trim().toLowerCase(); return u.includes('@') ? u : u + '@' + KEEPER_DOMAIN; };
  function openLogin() {

    $('#sheetRoot').innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Scorekeeper sign in">

  function write(id, patch, isSet) {
    M[id] = {...(isSet ? {} : M[id]), ...patch, id};
    render();
    const ref = db.collection(COL.m).doc(id);
    const body = {...patch}; delete body.id;
    chains[id] = (chains[id] || Promise.resolve()).then(() => isSet ? ref.set(body) : ref.update(body)).catch(e => {
      const code = e && e.code;
      if (code === 'permission-denied') { S.keeper = false; closeSheet(); toast('This account is not on the scorekeeper list. Ask the organizer to add it.'); render(); }
      else if (code === 'unauthenticated') toast('Sign in again to keep score.');
      else toast('Could not save that change. Check the connection and try again.');
    });
    return chains[id];
  }
  const snap = m => JSON.stringify({s: m.s || [], g: m.g || {a: 0, b: 0}, status: m.status || 'scheduled', winner: m.winner ?? null});
  const pushHist = m => [...(m.hist || []), snap(m)].slice(-25);
  // Before a playoff match starts, its teams are written into the match so they never shift afterwards.
  function lockTeams(m) {
    const patch = {};
    for (const side of [0, 1]) { const k = side ? 't2' : 't1'; if (m[k]) continue; const tm = teamOf(m, side); if (!tm.name) return null; patch[k] = tm.name; }
    return patch;
  }
  const blankMatch = () => ({court: '', time: '', t1: '', t2: '', group: '', stage: '', status: 'scheduled', s: [], g: {a: 0, b: 0}, winner: null, hist: [], t: 0});

  function makeBracket(cat) {
    const ops = db.batch(); let n = 0;
    const add = (st, slot) => { const id = brId(cat, st, slot); if (M[id]) return; ops.set(db.collection(COL.m).doc(id), {...blankMatch(), cat, stage: st, slot, day: STAGE_DAY[st]}); n++; };
    BRACKET[cat].rounds.forEach(st => { for (let i = 1; i <= roundSize(cat, st); i++) add(st, i); });
    if (CFG.third === true) add('3P', 1);
    if (!n) return toast('These playoff matches already exist.');
    ops.commit().then(() => toast(`${n} playoff matches created. Tap one to set its time and court.`)).catch(failToast);
  }
  function makeRoundRobin(key) {
    const [cat, name] = key.split('|'); const id = groupId(cat, name); if (!id) return toast('Save the group first.');
    const teams = (G[id].teams || []).filter(t => !isPlaceholder(t));
    const have = new Set(Object.values(M).filter(m => m.cat === cat && !m.stage).map(m => [tkey(m.t1), tkey(m.t2)].sort().join('|')));
    const ops = db.batch(); let n = 0; const stamp = Date.now().toString(36);
    for (let i = 0; i < teams.length; i++) for (let j = i + 1; j < teams.length; j++) {
      if (have.has([tkey(teams[i]), tkey(teams[j])].sort().join('|'))) continue;
      ops.set(db.collection(COL.m).doc(`${cat}-G${name}-${i + 1}${j + 1}-${stamp}`), {...blankMatch(), day: 1, cat, group: name, t1: teams[i], t2: teams[j]}); n++;
    }
    if (!n) return toast(teams.length < 2 ? 'Add at least two teams to this group first.' : 'Every match for this group already exists.');
    ops.commit().then(() => toast(`${n} matches added to Day 1. Tap each one to set its time and court.`)).catch(failToast);
  }

  function parseSets(txt) {
    return String(txt).split(/[,;\s]+/).filter(Boolean).map(p => p.split(/[-:]/).map(n => parseInt(n, 10))).filter(p => p.length === 2 && p.every(n => n >= 0)).map(p => ({a: p[0], b: p[1]}));
  }

  // ---------- events ----------
  document.addEventListener('click', e => {
    const t = e.target.closest('button,[data-id]'); if (!t) return;
    if (t.dataset.day) { S.day = +t.dataset.day; render(); return; }
    if (t.dataset.view) { S.view = t.dataset.view; render(); window.scrollTo({top: Math.min(window.scrollY, $('.bar').offsetTop)}); return; }
    if (t.dataset.cat) { S.cat = t.dataset.cat; render(); return; }
    if (t.id === 'keeper') { if (!user) openLogin(); else { S.keeper = !S.keeper; render(); } return; }
    if (t.id === 'signout') { auth.signOut(); return; }
    const act = t.dataset.act;
    if (!act && t.dataset.id && S.keeper && !t.closest('.sheet')) { openSheet(t.dataset.id); return; }
    if (t.dataset.gedit) { openGroup(t.dataset.gedit); return; }
    if (t.dataset.rr) { makeRoundRobin(t.dataset.rr); return; }
    if (t.dataset.mkbr) { makeBracket(t.dataset.mkbr); return; }
    if (act === 'rules') { openRules(); return; }
    if (act === 'close') return closeSheet();
    if (act === 'gdel') { $('#gdelConfirm').hidden = false; return; }
    if (act === 'gdel2') { const id = S.gopen; closeSheet(); db.collection(COL.g).doc(id).delete().then(() => toast('Group deleted.')).catch(failToast); return; }
    const m = M[S.open];
    if (!m) return;
    if (act === 'pt' || act === 'start') {
      const lock = lockTeams(m);
      if (!lock) return toast('The teams for this match are not decided yet. Finish the earlier matches, or type the teams under Edit match details.');
      if (act === 'pt') { const r = applyPoint(m, +t.dataset.side); if (r) { write(m.id, {...lock, ...r, hist: pushHist(m), t: Date.now()}); if (r.status === 'final') toast('Match final.'); } }
      else write(m.id, {...lock, status: 'live', hist: pushHist(m), t: Date.now()});
    }
    if (act === 'undo') { const h = [...(m.hist || [])]; const last = h.pop(); if (last) write(m.id, {...JSON.parse(last), hist: h, t: Date.now()}); }
    if (act === 'finish') { const s = setsArr(m); write(m.id, {status: 'final', winner: deriveWinner(s), g: {a: 0, b: 0}, hist: pushHist(m), t: Date.now()}); }
    if (act === 'reopen') write(m.id, {status: 'live', winner: null, hist: pushHist(m), t: Date.now()});
    if (act === 'del') $('#delConfirm').hidden = false;
    if (act === 'del2') { const id = m.id; closeSheet(); delete M[id]; render(); db.collection(COL.m).doc(id).delete().then(() => toast('Match deleted.')).catch(() => toast('Could not delete that match.')); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && (S.open || $('#scrim'))) closeSheet();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.keep[data-id]')) { e.preventDefault(); openSheet(e.target.dataset.id); }
  });
  document.addEventListener('mousedown', e => { if (e.target.id === 'scrim') closeSheet(); });
  document.addEventListener('submit', e => {
    e.preventDefault();
    const v = id => { const el = $('#' + id); return el ? el.value.trim() : ''; };
    if (e.target.id === 'groupf') {
      const cat = v('g-cat'), name = v('g-name').toUpperCase();
      const teams = $('#g-teams').value.split('\n').map(x => x.trim().replace(/\s+/g, ' ')).filter(Boolean);
      if (!name) return toast('Give the group a letter.');
      const newId = (cat + '-' + name).replace(/[^A-Za-z0-9_-]/g, '_');
      const clash = groupId(cat, name);
      if (clash && clash !== S.gopen) return toast(`Category ${cat} already has a Group ${name}.`);
      const oldId = S.gopen, ops = db.batch();
      ops.set(db.collection(COL.g).doc(newId), {cat, name, teams});
      if (oldId && oldId !== newId) ops.delete(db.collection(COL.g).doc(oldId));
      closeSheet();
      ops.commit().then(() => toast('Group saved.')).catch(failToast);
      return;
    }
    if (e.target.id === 'rulesf') {
      const third = v('r-third');
      const next = {deuce: v('r-deuce') || null, decider: v('r-dec') || null, third: third === 'yes' ? true : third === 'no' ? false : null};
      closeSheet();
      const ops = db.batch();
      ops.set(db.collection(COL.c).doc('rules'), next);
      CATS.forEach(cat => { const id = brId(cat, '3P', 1);
        if (next.third === true && bracketExists(cat) && !M[id]) ops.set(db.collection(COL.m).doc(id), {...blankMatch(), cat, stage: '3P', slot: 1, day: STAGE_DAY['3P']});
        if (next.third !== true && M[id] && M[id].status === 'scheduled' && !(M[id].s || []).length) ops.delete(db.collection(COL.m).doc(id)); });
      ops.commit().then(() => toast('Rules saved.')).catch(failToast);
      return;
    }
    if (e.target.id === 'loginf') {
      const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
      auth.signInWithEmailAndPassword(loginId($('#l-email').value), $('#l-pass').value)
        .then(() => { closeSheet(); S.keeper = true; render(); toast('Signed in. Tap a match to keep score.'); })
        .catch(err => { btn.disabled = false; toast(/password|credential|user-not-found/.test(err.code || '') ? 'Wrong username or password.' : err.code === 'auth/too-many-requests' ? 'Too many tries. Wait a minute and try again.' : 'Sign in failed. Check the connection.'); });
      return;
    }
    if (e.target.id === 'addf') {
      if (!v('a-t1') || !v('a-t2')) return toast('Fill in both teams.');
      const day = +v('a-day'), cat = v('a-cat');
      const id = `${cat}-d${day}-${Date.now().toString(36)}`;
      const doc = {...blankMatch(), day, cat, court: v('a-court'), time: fromInput(v('a-time')), t1: v('a-t1'), t2: v('a-t2'), group: v('a-group').toUpperCase()};
      ['a-time', 'a-court', 'a-t1', 'a-t2'].forEach(i => $('#' + i).value = '');
      S.day = day;
      write(id, doc, true).then(() => toast('Match added.'));
      return;
    }
    if (e.target.id === 'editf') {
      const m = M[S.open]; if (!m) return;
      const s0 = parseSets(v('e-sets')), status = v('e-status');
      const cat = m.stage ? m.cat : v('e-cat');
      const want = {bo: +v('e-bo'), games: Math.max(1, +v('e-games') || 6), tbAt: Math.max(1, +v('e-tb') || 6), deuce: v('e-deuce'), dec: v('e-dec')};
      const def = fmtOf({cat, stage: m.stage});
      const custom = Object.keys(want).some(k => want[k] !== def[k]);
      const s = s0.map((x, i) => (want.dec === 'stb' && want.bo > 1 && i === want.bo - 1 && Math.max(x.a, x.b) >= 10) ? {...x, tb: true} : x);
      const patch = {t1: v('e-t1'), t2: v('e-t2'), time: fromInput(v('e-time')), court: v('e-court'), day: +v('e-day'), s, status,
        winner: status === 'final' ? deriveWinner(s.map(x => [x.a, x.b])) : null, custom, hist: pushHist(m), t: Date.now(),
        ...(custom ? want : {bo: null, games: null, tbAt: null, deuce: null, dec: null})};
      if (!m.stage) { patch.group = v('e-group').toUpperCase(); patch.cat = cat; }
      if (status !== 'live') patch.g = {a: 0, b: 0};
      write(m.id, patch).then(() => toast('Saved.'));
      closeSheet();
    }
  });

  setInterval(() => document.querySelectorAll('[data-ago]').forEach(el => el.textContent = 'Updated ' + ago(+el.dataset.ago)), 1000);

  // ---------- boot ----------
  render();
  try {
    firebase.initializeApp({
      apiKey: "AIzaSyBkOtB6I3D4HajXkx4XNj7Dbsz_kliCEqQ",
      authDomain: "padeltournament-ed489.firebaseapp.com",
      projectId: "padeltournament-ed489",
      storageBucket: "padeltournament-ed489.firebasestorage.app",
      messagingSenderId: "663039407255",
      appId: "1:663039407255:web:f99230f8969a25582025d2"
    });
    db = firebase.firestore(); auth = firebase.auth();
    db.enablePersistence({synchronizeTabs: true}).catch(() => {});
  } catch (err) { db = null; loaded = true; render(); }
  if (db) {
    auth.onAuthStateChanged(u => { user = u; if (!u) S.keeper = false; render(); });
    db.collection(COL.c).doc('rules').onSnapshot(d => { CFG = d.exists ? (d.data() || {}) : {}; render(); }, () => {});
    db.collection(COL.g).onSnapshot(q => { const next = {}; q.docs.forEach(d => { next[d.id] = d.data(); }); G = next; if (loaded) render(); }, () => {});
    db.collection(COL.m).onSnapshot(q => {
      const next = {}; q.docs.forEach(d => { next[d.id] = {...d.data(), id: d.id}; });
      M = next; loaded = true; render();
    }, () => { loaded = true; toast('Live connection lost. Reload the page to reconnect.'); render(); });
  }
  window.__trio = {applyPoint, fmtOf, setM: x => { M = x; loaded = true; render(); }, setG: x => { G = x; render(); }, setCFG: x => { CFG = x; render(); }, S, render};
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
